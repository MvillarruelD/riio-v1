name: release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,genome,gui]" -r analysis/requirements.txt
      - name: Search engine used by released-data integration tests
        run: sudo apt-get update && sudo apt-get install -y mmseqs2
      - run: python tools/build_data_manifest.py --check
      - run: python -m ruff check predictor tests tools analysis reports
      - run: python -m pytest -ra
      - run: python -m pytest -ra -m released_data

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,genome]" -r analysis/requirements.txt
      - name: Isolated wheel, source archive, packaged data and CLI
        run: python tools/release_check.py --skip-tests --selftest-timeout 120
      - name: Build downloadable artifacts
        run: python -m build --wheel --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: riio-distributions
          path: dist/*
