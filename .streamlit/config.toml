[theme]
base = "light"
primaryColor = "#B4431F"
backgroundColor = "#F4F1EA"
secondaryBackgroundColor = "#EAE6DB"
textColor = "#1D1C19"
font = "sans-serif"

# Same defaults as the `tfop-gui` launcher: serve this machine only, send no usage statistics.
[server]
address = "localhost"

[browser]
gatherUsageStats = false
