# The canonical run: the ONE place report, figure and benchmark scripts read to find their data.
# Re-pointing every downstream artefact at a new run is an edit to this file and nothing else.
#
# Current canonical run: the 2026-11-10 final rerun (predictor tag rerun20261110 = 1cfefc7),
# structure OFF, stages A (E. coli, Salmonella) and B (survey) of analysis/final_rerun/, in three run
# roots. Re-pointed 2026-11-11 with repoint_canonical.py --write after the runbook section 11 checks
# and acceptance A1-A8 of analysis/FINAL_RERUN_PREREG_20261110.md held: 238/238 bundles complete;
# every run_record carries git_commit 1cfefc7, git_dirty false and allow_folds false; every bundle
# carries the one runtime fingerprint below (postflight A and B passed).
#
# Why it was promoted: it is the run intended as final. It carries EXP064-EXP072 (operon_chem
# inducer source, identity policy, two-ion shortlists, coordination-gate split of FrmR/RcnR,
# TF-gene best-overlap fix) and FRESH discovery on all six genomes (Amendment 2). The V. cholerae
# reference strain changed from RFB16 (GCF_008369605.1) to O1 biovar El Tor N16961
# (GCF_000006745.1) (Amendment 1), so the survey's V. cholerae candidates are a different set
# (prefix VchoN16961), and the six-genome homolog pool differs for every candidate.
#
# Superseded: the 2026-09-24 rerun (predictor e9ba665 = v1.0.0-rc, runtime 16034b7a...), roots
# C:/Users/matia/dev/jjr_fresh_runs/run_{ecoli,salm,survey}_rerun20260924; before it the
# 2026-09-17 reruns (predictor 9fe0c32, runtime 8bfae31...), run_{...}_rerun20260917.

